<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Uso de Veículo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            -webkit-text-size-adjust: 100%;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 15px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin: 10px 0;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 12px;
        }
        button:hover {
            background-color: #218838;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-size: 14px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: flex-start;
            z-index: 1000;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            position: relative;
        }
        .close {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }
        .filtro-container {
            margin-bottom: 15px;
        }
        .filtro-item {
            margin-bottom: 10px;
        }
        .checkbox-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        .checkbox-container input {
            width: auto;
            margin-right: 5px;
        }
        .scrollable-table {
            overflow-x: auto;
            margin-top: 10px;
            width: 100%;
        }
        .acoes-cell {
            white-space: nowrap;
        }
        .pdf-icon {
            color: #d32f2f;
            cursor: pointer;
            margin-left: 8px;
            font-size: 16px;
        }
        .pdf-icon:hover {
            color: #b71c1c;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .button-group button {
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
                margin: 5px;
            }
            h2 {
                font-size: 20px;
            }
            h3 {
                font-size: 18px;
            }
            input, select, button {
                padding: 8px;
                font-size: 14px;
            }
            th, td {
                padding: 4px;
                font-size: 13px;
            }
            .modal-content {
                padding: 15px 10px;
            }
        }
    </style>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <!-- jsPDF para gerar PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Controle de Uso de Veículo</h2>
        <form id="usoForm">
            <label for="data">Data:</label>
            <input type="date" id="data" required>

            <label for="kmInicial">Km Inicial:</label>
            <input type="number" id="kmInicial" required min="0">

            <label for="kmFinal">Km Final:</label>
            <input type="number" id="kmFinal" required min="0">

            <label for="nome">Nome:</label>
            <select id="nome" required>
                <option value="Angela">Angela</option>
                <option value="Ricardo">Ricardo</option>
            </select>

            <button type="button" onclick="adicionarUso()">Adicionar Uso</button>
        </form>

        <h3>Abastecimentos</h3>
        <form id="abastecimentoForm">
            <label for="dataAbastecimento">Data:</label>
            <input type="date" id="dataAbastecimento" required>

            <label for="fatura">Fatura (Mês/Ano):</label>
            <input type="month" id="fatura" required>

            <label for="valor">Valor:</label>
            <input type="number" id="valor" step="0.01" required min="0.01">

            <label for="combustivel">Combustível:</label>
            <select id="combustivel" required>
                <option value="Etanol">Etanol</option>
                <option value="Gasolina">Gasolina</option>
            </select>

            <label for="litros">Litros:</label>
            <input type="number" id="litros" step="0.01" required min="0.01">

            <button type="button" onclick="adicionarAbastecimento()">Adicionar Abastecimento</button>
        </form>

        <h3>Resumo</h3>
        <label for="faturaResumo">Selecione a Fatura:</label>
        <input type="month" id="faturaResumo" onchange="atualizarResumo()">

        <table id="resumoTable">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Km Rodado</th>
                    <th>Valor a Pagar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão inseridos aqui via JavaScript -->
            </tbody>
        </table>

        <div class="button-group">
            <button onclick="abrirModal('usoModal')">Ver Usos</button>
            <button onclick="abrirModal('abastecimentoModal')">Ver Abastecimentos</button>
        </div>
    </div>

    <!-- Modal para Usos -->
    <div id="usoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('usoModal')">&times;</span>
            <h3>Registros de Uso</h3>
            
            <div class="filtro-container">
                <div class="filtro-item">
                    <label for="filtroDataUso">Filtrar por Mês/Ano:</label>
                    <input type="month" id="filtroDataUso" onchange="aplicarFiltrosUsos()">
                </div>
                
                <div class="filtro-item">
                    <label>Filtrar por Nome:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-container">
                            <input type="checkbox" id="filtroAngela" checked onchange="aplicarFiltrosUsos()">
                            <label for="filtroAngela">Angela</label>
                        </div>
                        <div class="checkbox-container">
                            <input type="checkbox" id="filtroRicardo" checked onchange="aplicarFiltrosUsos()">
                            <label for="filtroRicardo">Ricardo</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="secondary" onclick="limparFiltrosUsos()">Limpar Filtros</button>
            
            <div class="scrollable-table">
                <table id="tabelaUsos">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Km Inicial</th>
                            <th>Km Final</th>
                            <th>Nome</th>
                            <th class="acoes-cell">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dados serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Abastecimentos -->
    <div id="abastecimentoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('abastecimentoModal')">&times;</span>
            <h3>Registros de Abastecimento</h3>
            
            <div class="filtro-container">
                <div class="filtro-item">
                    <label for="filtroFaturaAbastecimento">Filtrar por Fatura:</label>
                    <input type="month" id="filtroFaturaAbastecimento" onchange="aplicarFiltrosAbastecimentos()">
                </div>
            </div>
            
            <button class="secondary" onclick="limparFiltrosAbastecimentos()">Limpar Filtro</button>
            
            <div class="scrollable-table">
                <table id="tabelaAbastecimentos">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Fatura</th>
                            <th>Valor</th>
                            <th>Combustível</th>
                            <th>Litros</th>
                            <th class="acoes-cell">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dados serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Firebase com suas credenciais
        const firebaseConfig = {
            apiKey: "AIzaSyDThG0_U_UbsLAQJEbck_H6nb2G16MXMR0",
            authDomain: "controlecustoveiculo.firebaseapp.com",
            projectId: "controlecustoveiculo",
            storageBucket: "controlecustoveiculo.appspot.com",
            messagingSenderId: "481729956678",
            appId: "1:481729956678:web:b01786914a81899fa87347"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Inicializar jsPDF
        const { jsPDF } = window.jspdf;

        let usos = [];
        let abastecimentos = [];

        // Função para salvar o KM inicial no localStorage
        function salvarKmInicial() {
            const kmInicial = document.getElementById('kmInicial').value;
            localStorage.setItem('ultimoKmInicial', kmInicial);
        }

        // Função para carregar o KM inicial do localStorage
        function carregarKmInicial() {
            const kmInicialSalvo = localStorage.getItem('ultimoKmInicial');
            if (kmInicialSalvo !== null) {
                document.getElementById('kmInicial').value = kmInicialSalvo;
            }
        }

        // Função para abrir modal
        function abrirModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
            if (modalId === 'usoModal') {
                aplicarFiltrosUsos();
            } else if (modalId === 'abastecimentoModal') {
                aplicarFiltrosAbastecimentos();
            }
            // Rolagem para o topo do modal
            document.querySelector(`#${modalId} .modal-content`).scrollTo(0, 0);
        }

        // Função para fechar modal
        function fecharModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Função para adicionar uso ao Firestore
        async function adicionarUso() {
            const data = document.getElementById('data').value;
            const kmInicial = parseInt(document.getElementById('kmInicial').value);
            const kmFinal = parseInt(document.getElementById('kmFinal').value);
            const nome = document.getElementById('nome').value;
            
            if (kmFinal <= kmInicial) {
                alert('O km final deve ser maior que o km inicial!');
                return;
            }
            
            const kmRodado = kmFinal - kmInicial;

            try {
                await db.collection('usos').add({ data, kmInicial, kmFinal, nome, kmRodado });
                alert('Uso registrado com sucesso!');
                document.getElementById('usoForm').reset();
                // Mantém o KM inicial salvo mesmo após enviar o formulário
                document.getElementById('kmInicial').value = kmFinal;
                salvarKmInicial();
                carregarDados();
            } catch (error) {
                console.error("Erro ao adicionar uso:", error);
                alert('Erro ao registrar uso!');
            }
        }

        // Função para adicionar abastecimento ao Firestore
        async function adicionarAbastecimento() {
            const dataAbastecimento = document.getElementById('dataAbastecimento').value;
            const fatura = document.getElementById('fatura').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const combustivel = document.getElementById('combustivel').value;
            const litros = parseFloat(document.getElementById('litros').value);

            if (valor <= 0 || litros <= 0) {
                alert('Valor e litros devem ser maiores que zero!');
                return;
            }

            try {
                await db.collection('abastecimentos').add({
                    data: dataAbastecimento,
                    fatura,
                    valor,
                    combustivel,
                    litros
                });
                alert('Abastecimento registrado com sucesso!');
                document.getElementById('abastecimentoForm').reset();
                carregarDados();
            } catch (error) {
                console.error("Erro ao adicionar abastecimento:", error);
                alert('Erro ao registrar abastecimento!');
            }
        }

        // Função para ordenar usos por data (crescente)
        function ordenarUsosPorData() {
            usos.sort((a, b) => new Date(a.data) - new Date(b.data));
        }

        // Função para ordenar abastecimentos por data (crescente)
        function ordenarAbastecimentosPorData() {
            abastecimentos.sort((a, b) => new Date(a.data) - new Date(b.data));
        }

        // Função para aplicar filtros nos usos
        function aplicarFiltrosUsos() {
            const mesAno = document.getElementById('filtroDataUso').value;
            const filtroAngela = document.getElementById('filtroAngela').checked;
            const filtroRicardo = document.getElementById('filtroRicardo').checked;
            
            let usosFiltrados = usos;
            
            // Aplicar filtro por data
            if (mesAno) {
                const [ano, mes] = mesAno.split('-');
                usosFiltrados = usosFiltrados.filter(uso => {
                    const [usoAno, usoMes] = uso.data.split('-');
                    return usoAno === ano && usoMes === mes;
                });
            }
            
            // Aplicar filtro por nome
            const nomesSelecionados = [];
            if (filtroAngela) nomesSelecionados.push('Angela');
            if (filtroRicardo) nomesSelecionados.push('Ricardo');
            
            if (nomesSelecionados.length > 0) {
                usosFiltrados = usosFiltrados.filter(uso => nomesSelecionados.includes(uso.nome));
            }
            
            atualizarTabelaUsos(usosFiltrados);
        }

        // Função para limpar filtros dos usos
        function limparFiltrosUsos() {
            document.getElementById('filtroDataUso').value = '';
            document.getElementById('filtroAngela').checked = true;
            document.getElementById('filtroRicardo').checked = true;
            atualizarTabelaUsos(usos);
        }

        // Função para aplicar filtros nos abastecimentos
        function aplicarFiltrosAbastecimentos() {
            const fatura = document.getElementById('filtroFaturaAbastecimento').value;
            
            let abastecimentosFiltrados = abastecimentos;
            
            // Aplicar filtro por fatura
            if (fatura) {
                abastecimentosFiltrados = abastecimentosFiltrados.filter(ab => ab.fatura === fatura);
            }
            
            atualizarTabelaAbastecimentos(abastecimentosFiltrados);
        }

        // Função para limpar filtros dos abastecimentos
        function limparFiltrosAbastecimentos() {
            document.getElementById('filtroFaturaAbastecimento').value = '';
            atualizarTabelaAbastecimentos(abastecimentos);
        }

        // Função para gerar PDF com os usos de uma pessoa específica
        function gerarPDF(nome, faturaSelecionada) {
            // Encontrar o primeiro abastecimento da fatura selecionada
            const primeiroAbastecimentoFatura = abastecimentos.find(abastecimento => abastecimento.fatura === faturaSelecionada);
            
            let usosNoPeriodo = [];
            let dataInicio = new Date();
            let dataFim = new Date();
            
            if (primeiroAbastecimentoFatura) {
                dataInicio = new Date(primeiroAbastecimentoFatura.data);

                // Encontrar o primeiro abastecimento da próxima fatura
                const faturas = [...new Set(abastecimentos.map(abastecimento => abastecimento.fatura))];
                const indiceFaturaSelecionada = faturas.indexOf(faturaSelecionada);
                const proximaFatura = faturas[indiceFaturaSelecionada + 1];

                if (proximaFatura) {
                    const primeiroAbastecimentoProximaFatura = abastecimentos.find(abastecimento => abastecimento.fatura === proximaFatura);
                    dataFim = new Date(primeiroAbastecimentoProximaFatura.data);
                    dataFim.setDate(dataFim.getDate() - 1);
                } else {
                    dataFim = new Date();
                }

                // Filtrar usos no período para a pessoa específica
                usosNoPeriodo = usos.filter(uso => {
                    const dataUso = new Date(uso.data);
                    return dataUso >= dataInicio && dataUso <= dataFim && uso.nome === nome;
                });
            }

            // Calcular total de km rodados
            const totalKm = usosNoPeriodo.reduce((sum, uso) => sum + uso.kmRodado, 0);

            // Criar PDF
            const doc = new jsPDF();
            
            // Título
            doc.setFontSize(16);
            doc.text(`Relatório de Uso - ${nome}`, 105, 15, { align: 'center' });
            
            // Período
            doc.setFontSize(12);
            doc.text(`Fatura: ${formatarMesAno(faturaSelecionada)}`, 14, 25);
            doc.text(`Período: ${formatarDataParaPDF(dataInicio)} a ${formatarDataParaPDF(dataFim)}`, 14, 35);
            
            // Tabela de usos
            const headers = [['Data', 'Km Inicial', 'Km Final', 'Km Rodado']];
            const data = usosNoPeriodo.map(uso => [
                formatarData(uso.data),
                uso.kmInicial,
                uso.kmFinal,
                uso.kmRodado
            ]);
            
            doc.autoTable({
                startY: 45,
                head: headers,
                body: data,
                theme: 'grid',
                headStyles: { fillColor: [41, 128, 185] },
                columnStyles: {
                    0: { cellWidth: 40 },
                    1: { cellWidth: 30 },
                    2: { cellWidth: 30 },
                    3: { cellWidth: 30 }
                }
            });
            
            // Total
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            doc.text(`Total de Km Rodados: ${totalKm} km`, 14, finalY);
            
            // Salvar PDF
            doc.save(`Relatorio_${nome}_${faturaSelecionada}.pdf`);
        }

        // Função para formatar data para o PDF (DD/MM/AAAA)
        function formatarDataParaPDF(data) {
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const ano = data.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        // Função para formatar mês/ano (MM/AAAA)
        function formatarMesAno(mesAno) {
            const [ano, mes] = mesAno.split('-');
            return `${mes}/${ano}`;
        }

        // Função para carregar dados do Firestore
        async function carregarDados() {
            try {
                const usosSnapshot = await db.collection('usos').get();
                usos = usosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                ordenarUsosPorData();

                const abastecimentosSnapshot = await db.collection('abastecimentos').get();
                abastecimentos = abastecimentosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                ordenarAbastecimentosPorData();

                atualizarResumo();
                atualizarTabelaUsos();
                atualizarTabelaAbastecimentos();
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                alert('Erro ao carregar dados do banco de dados!');
            }
        }

        // Função para atualizar o resumo
        function atualizarResumo() {
            const faturaSelecionada = document.getElementById('faturaResumo').value;
            const resumo = { Angela: { kmRodado: 0, valorPagar: 0 }, Ricardo: { kmRodado: 0, valorPagar: 0 } };

            // Encontrar o primeiro abastecimento da fatura selecionada
            const primeiroAbastecimentoFatura = abastecimentos.find(abastecimento => abastecimento.fatura === faturaSelecionada);

            if (primeiroAbastecimentoFatura) {
                const dataInicio = new Date(primeiroAbastecimentoFatura.data);

                // Encontrar o primeiro abastecimento da próxima fatura
                const faturas = [...new Set(abastecimentos.map(abastecimento => abastecimento.fatura))];
                const indiceFaturaSelecionada = faturas.indexOf(faturaSelecionada);
                const proximaFatura = faturas[indiceFaturaSelecionada + 1];

                let dataFim;
                if (proximaFatura) {
                    const primeiroAbastecimentoProximaFatura = abastecimentos.find(abastecimento => abastecimento.fatura === proximaFatura);
                    dataFim = new Date(primeiroAbastecimentoProximaFatura.data);
                    dataFim.setDate(dataFim.getDate() - 1);
                } else {
                    dataFim = new Date();
                }

                // Filtrar usos no período
                const usosNoPeriodo = usos.filter(uso => {
                    const dataUso = new Date(uso.data);
                    return dataUso >= dataInicio && dataUso <= dataFim;
                });

                // Calcular o total de km rodados por nome
                usosNoPeriodo.forEach(uso => {
                    resumo[uso.nome].kmRodado += uso.kmRodado;
                });

                // Calcular o valor a pagar
                const totalKmPeriodo = resumo.Angela.kmRodado + resumo.Ricardo.kmRodado;
                if (totalKmPeriodo > 0) {
                    const abastecimentosFatura = abastecimentos.filter(abastecimento => abastecimento.fatura === faturaSelecionada);
                    abastecimentosFatura.forEach(abastecimento => {
                        const proporcaoAngela = resumo.Angela.kmRodado / totalKmPeriodo;
                        const proporcaoRicardo = resumo.Ricardo.kmRodado / totalKmPeriodo;

                        resumo.Angela.valorPagar += abastecimento.valor * proporcaoAngela;
                        resumo.Ricardo.valorPagar += abastecimento.valor * proporcaoRicardo;
                    });
                }
            }

            // Atualizar a tabela de resumo
            const tbody = document.querySelector('#resumoTable tbody');
            tbody.innerHTML = `
                <tr>
                    <td>Angela <i class="fas fa-file-pdf pdf-icon" onclick="gerarPDF('Angela', '${faturaSelecionada}')" title="Exportar PDF"></i></td>
                    <td>${resumo.Angela.kmRodado} km</td>
                    <td>R$ ${resumo.Angela.valorPagar.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Ricardo <i class="fas fa-file-pdf pdf-icon" onclick="gerarPDF('Ricardo', '${faturaSelecionada}')" title="Exportar PDF"></i></td>
                    <td>${resumo.Ricardo.kmRodado} km</td>
                    <td>R$ ${resumo.Ricardo.valorPagar.toFixed(2)}</td>
                </tr>
            `;
        }

        // Função para atualizar a tabela de usos no modal
        function atualizarTabelaUsos(listaUsos = usos) {
            const tbody = document.querySelector('#tabelaUsos tbody');
            tbody.innerHTML = listaUsos.map(uso => `
                <tr>
                    <td>${formatarData(uso.data)}</td>
                    <td>${uso.kmInicial}</td>
                    <td>${uso.kmFinal}</td>
                    <td>${uso.nome}</td>
                    <td class="acoes-cell">
                        <button onclick="excluirUso('${uso.id}')">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        // Função para formatar data no formato DD/MM/AAAA
        function formatarData(dataString) {
            if (!dataString) return '';
            const [ano, mes, dia] = dataString.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // Função para atualizar a tabela de abastecimentos no modal
        function atualizarTabelaAbastecimentos(listaAbastecimentos = abastecimentos) {
            const tbody = document.querySelector('#tabelaAbastecimentos tbody');
            tbody.innerHTML = listaAbastecimentos.map(abastecimento => `
                <tr>
                    <td>${formatarData(abastecimento.data)}</td>
                    <td>${abastecimento.fatura}</td>
                    <td>R$ ${abastecimento.valor.toFixed(2)}</td>
                    <td>${abastecimento.combustivel}</td>
                    <td>${abastecimento.litros.toFixed(2)} L</td>
                    <td class="acoes-cell">
                        <button onclick="excluirAbastecimento('${abastecimento.id}')">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        // Função para excluir uso
        async function excluirUso(id) {
            if (confirm('Tem certeza que deseja excluir este uso?')) {
                try {
                    await db.collection('usos').doc(id).delete();
                    alert('Uso excluído com sucesso!');
                    carregarDados();
                } catch (error) {
                    console.error("Erro ao excluir uso:", error);
                    alert('Erro ao excluir uso!');
                }
            }
        }

        // Função para excluir abastecimento
        async function excluirAbastecimento(id) {
            if (confirm('Tem certeza que deseja excluir este abastecimento?')) {
                try {
                    await db.collection('abastecimentos').doc(id).delete();
                    alert('Abastecimento excluído com sucesso!');
                    carregarDados();
                } catch (error) {
                    console.error("Erro ao excluir abastecimento:", error);
                    alert('Erro ao excluir abastecimento!');
                }
            }
        }

        // Carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', function() {
            // Configura datas mínimas e valores padrão
            const hoje = new Date();
            const hojeISO = hoje.toISOString().split('T')[0];
            
            // Remove a restrição de data mínima para permitir meses anteriores
            document.getElementById('data').value = hojeISO;
            document.getElementById('dataAbastecimento').value = hojeISO;
            
            const mesAtual = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
            document.getElementById('fatura').value = mesAtual;
            document.getElementById('faturaResumo').value = mesAtual;
            
            // Carrega o KM inicial salvo
            carregarKmInicial();
            
            // Salva o KM inicial sempre que for alterado
            document.getElementById('kmInicial').addEventListener('change', salvarKmInicial);
            
            carregarDados();
        });
    </script>
</body>
</html>
